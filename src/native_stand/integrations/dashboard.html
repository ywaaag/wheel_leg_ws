<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="icon" href="data:,"><title>训练与能力看板</title><style>
body{font:15px system-ui;background:#101827;color:#e3eaf3;margin:32px}button,select{padding:8px;background:#22334b;color:inherit;border:1px solid #557;border-radius:5px}section{overflow-x:auto;background:#18263a;padding:20px;margin:18px 0;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #345;text-align:left}pre{white-space:pre-wrap;max-height:300px;overflow:auto}a{color:#86c9ff}canvas{width:100%;height:220px}small{color:#afbdd0}</style>
<h1>训练与能力看板 · 只读</h1><button id="refresh">刷新</button> <label><input id="auto" type="checkbox">页面开启期间每30秒刷新</label> <select id="run"></select><p id="meta"></p><main id="content"></main>
<script>
const $=s=>document.querySelector(s);let snapshot, timer;
const text=v=>v===undefined||v===null?'UNKNOWN':typeof v==='object'?JSON.stringify(v):String(v);
function node(tag,t,parent){let n=document.createElement(tag);if(t!==undefined)n.textContent=text(t);parent?.append(n);return n}
function section(title){let s=node('section',undefined,$('#content'));node('h2',title,s);return s}
function table(rows,fields,parent){let t=node('table',undefined,parent),h=node('tr',undefined,t);fields.forEach(k=>node('th',k,h));rows.forEach(r=>{let tr=node('tr',undefined,t);fields.forEach(k=>node('td',text(r[k]),tr));if(r.evidence_id){let a=node('a','原始证据',node('td',undefined,tr));a.href='/api/evidence/'+r.evidence_id;a.target='_blank';a.rel='noopener'}})}
function render(){let r=snapshot.runs[$('#run').value];$('#content').replaceChildren();if(!r)return;
let s=section('任务总览');table([r],['name','task','backend','course','status','process','run_metadata_updated_at','updates_used','used','limits','remaining'],s);node('p','消耗只来自state/budget；RUNNING不等于进程存活。',s);node('pre',{latest:r.latest_model,selected:r.selected_model,candidates:r.candidates,inventory:r.inventory,source_model:r.source_model,attempts:r.attempts,model_references:r.model_references},s);
s=section('训练趋势 · 原始值');let select=node('select',undefined,s);let series=r.metrics.map(row=>{let out={...row};function flatten(v,p){for(let [k,x] of Object.entries(v||{})){let key=p?`${p}.${k}`:k;if(typeof x==='number')out[key]=x;else if(x&&typeof x==='object'&&!Array.isArray(x))flatten(x,key)}}flatten(row,'');return out});let keys=[...new Set(series.flatMap(Object.keys))].filter(k=>series.some(x=>typeof x[k]==='number'));keys.forEach(k=>{let o=node('option',k,select);o.value=k});if(keys.includes('reward_mean'))select.value='reward_mean';let canvas=node('canvas',undefined,s);canvas.width=1100;canvas.height=220;let info=node('p',undefined,s);function plot(){let c=canvas.getContext('2d');c.clearRect(0,0,1100,220);let rows=series.filter(x=>Number.isFinite(x[select.value])&&Number.isFinite(x.update));if(!rows.length){info.textContent='UNKNOWN';return}let ys=rows.map(x=>x[select.value]),xs=rows.map(x=>x.update),lo=Math.min(...ys),hi=Math.max(...ys),xmin=Math.min(...xs),xmax=Math.max(...xs);c.strokeStyle='#66d9ce';c.beginPath();let prev;rows.forEach(x=>{let px=30+1040*(x.update-xmin)/(xmax-xmin||1),py=190-160*(x[select.value]-lo)/(hi-lo||1);if(!prev||x.stage!==prev.stage||x.attempt!==prev.attempt||x.update<=prev.update)c.moveTo(px,py);else c.lineTo(px,py);c.fillStyle='#66d9ce';c.fillRect(px-2,py-2,4,4);prev=x});c.stroke();info.textContent=`update ${xmin}–${xmax}；${select.value} ${lo}–${hi}；n=${rows.length}。阶段/attempt分段；不平滑。课程条件未写入指标时，不据折线判断能力改善/退化。`}select.onchange=plot;plot();node('p',r.metric_attempt_note,s);node('small','allocated/reserved是Torch记录；不代表进程总显存或整卡占用。CPU墙钟不代表GPU kernel时间。',s);
s=section('目标矩阵 · 与实际配方覆盖分开');let target=snapshot.targets?.[r.task];node('p',target?.scope||'领域目标适配不支持',s);table(target?.rows||[],['capability_id','target','relationship','priority'],s);
s=section('A · 训练窗口（跨策略随机回合）');node('p',r.matrix_support,s);node('p','目标矩阵是规划，不是本配方覆盖或能力证书。缺少机器可读目标适配时不计算完成百分比。',s);let filter=node('input',undefined,s);filter.placeholder='筛选key/命令/高度';filter.setAttribute('aria-label','筛选训练窗口');let windowTable=node('div',undefined,s);function renderWindows(){windowTable.replaceChildren();let filtered=r.windows.filter(w=>JSON.stringify([w.key,w.command,w.height]).includes(filter.value));table(filtered,['update','key','command','height','actual_height_m','terrain','profile','DR','perturbation','sample_count_status','actual_student_policy_samples','actual_all_transitions','ended_episodes','completed_episodes','pass_fraction','quality_pass_fraction','mean_physical_vx','mean_physical_yaw','height_MAE_m','mean_dual_support_fraction','failed_check_counts','thresholds','reasons'],windowTable);}filter.oninput=renderWindows;renderWindows();
node('h3','同任务窗口比较',s);let a=node('select',undefined,s),b=node('select',undefined,s),result=node('p',undefined,s);r.windows.forEach((w,i)=>[a,b].forEach(el=>{let o=node('option',`${w.update} / ${w.key}`,el);o.value=i}));async function requestComparison(layer,left,right,output){if(left===''||right===''){output.textContent='证据不足：缺少可比较记录';return}try{let q=new URLSearchParams({run:r.id,layer,left,right});let response=await fetch('/api/compare?'+q);if(!response.ok)throw Error('缺少可比较记录');let v=await response.json();output.textContent=v.verdict+`；n=${text(v.n)}。`+v.note}catch(e){output.textContent='证据不足：'+e.message}}function compare(){requestComparison('windows',a.value,b.value,result)}a.onchange=b.onchange=compare;compare();
s=section('B · 固定模型独立验证');node('p',r.evaluations.length?'仅展示原始协议和成绩；完成不等于能力通过。':'未独立验证',s);r.evaluations.forEach(e=>{node('pre',e,s);let link=node('a','核验SHA的原始证据',s);link.href='/api/evidence/'+e.evidence_id});
node('h3','固定模型比较（独立于训练窗口）',s);let fa=node('select',undefined,s),fb=node('select',undefined,s),fr=node('p',undefined,s);r.fixed_rows.forEach((w,i)=>[fa,fb].forEach(el=>{let o=node('option',`${w.checkpoint_sha256} / ${text(w.condition)}`,el);o.value=i}));function fc(){requestComparison('fixed_rows',fa.value,fb.value,fr)}fa.onchange=fb.onchange=fc;fc();
s=section('C · 实机验证');node('p',r.hardware_status,s);s=section('数据读取状态');node('pre',{source:r.source,errors:r.errors},s)}
async function refresh(){try{snapshot=await(await fetch('/api/snapshot')).json();let old=$('#run').value;$('#run').replaceChildren();snapshot.runs.forEach((r,i)=>{let o=node('option',r.name,$('#run'));o.value=i});$('#run').value=old||'0';$('#meta').textContent=snapshot.read_at+' · '+snapshot.source_kind+' · '+snapshot.limits;if(snapshot.tensorboard_url){let link=node('a',' 打开已有TensorBoard',$('#meta'));link.href=snapshot.tensorboard_url;link.target='_blank';link.rel='noopener'}render()}catch(e){$('#meta').textContent='读取失败（不是任务失败）：'+e.message}}
$('#run').onchange=render;$('#refresh').onclick=refresh;$('#auto').onchange=()=>{clearInterval(timer);if($('#auto').checked)timer=setInterval(refresh,30000)};window.addEventListener('pagehide',()=>clearInterval(timer));refresh();
</script></html>
