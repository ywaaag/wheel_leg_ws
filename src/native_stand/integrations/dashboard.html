<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,"><title>训练与能力看板</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#142035;--line:#293a53;--text:#e7eef9;--muted:#9dacc4;--blue:#7aaaff;--cyan:#4edac5;--orange:#f6b86a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,sans-serif}header{padding:24px max(24px,calc((100vw - 1440px)/2));border-bottom:1px solid var(--line);background:#101b2d}h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}p{margin:8px 0}.muted,small{color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);padding:2px 9px;border-radius:20px;font-size:12px;color:var(--muted)}.status-running{color:var(--blue)}.status-failed{color:#ff9e9e}.toolbar,.row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.toolbar{margin-top:18px}button,select,input{font:inherit;color:var(--text);background:#1a2c46;border:1px solid #3c5271;border-radius:7px;padding:8px 11px}button{cursor:pointer}button:hover{border-color:var(--blue)}select#run{min-width:290px;max-width:680px;width:min(680px,90vw)}a{color:#a0c6ff;text-decoration:none}a:hover{text-decoration:underline}nav{display:flex;gap:20px;margin-top:12px}main{max-width:1488px;margin:auto;padding:24px}section{margin-bottom:24px;scroll-margin-top:16px}.panel,.chart,.stat,.model{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.stat .value{font-size:26px;font-weight:650;line-height:1.3;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.chart{min-width:0}.chart svg{width:100%;height:235px;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:16px;height:3px;margin-right:5px;vertical-align:middle}.chart-note{font-size:12px;color:var(--muted);min-height:20px;margin-top:8px}.empty{padding:28px 12px;text-align:center;color:var(--muted);background:#101a2c;border:1px dashed var(--line);border-radius:8px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}td{max-width:360px;overflow-wrap:anywhere}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.model .name{font-weight:600;margin:8px 0}.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 16px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.notice{border-left:3px solid var(--orange);padding:10px 16px;background:#211e22;border-radius:5px;margin:12px 0}.rate{white-space:nowrap;font-weight:600}.bar{width:80px;height:4px;border-radius:4px;background:#2c3b51;margin-top:5px}.bar span{display:block;height:100%;background:var(--cyan);border-radius:4px}details{margin:12px 0}summary{cursor:pointer;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1626;padding:12px;border-radius:6px;max-height:360px;overflow:auto;font:12px/1.6 ui-monospace,monospace}#load-state{margin-top:10px;color:var(--muted)}.tiny{font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.comparison-result{padding:12px;background:#101a2b;border-radius:7px;margin-top:14px}.good{color:var(--cyan)}footer{color:var(--muted);padding:24px;text-align:center}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.models{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}header,main{padding:18px}h1{font-size:21px}}
</style>
<script src="/dashboard.js" defer></script>
</head>
<body>
<header>
<div class="row"><h1>训练与能力看板</h1><span class="badge">只读 · 不控制训练</span></div>
<div class="muted">训练指标、固定模型验证、实机结果分别展示。缺失数据不填零。</div>
<div class="toolbar"><label>领域 <select id="task" aria-label="选择领域"><option value="">全部领域</option></select></label><label>任务 <select id="run" aria-label="选择训练任务"></select></label><button id="refresh">刷新数据</button><label class="muted"><input id="auto" type="checkbox"> 每30秒刷新</label></div>
<div id="load-state">正在读取已落盘产物…</div>
<nav><a href="#overview">任务总览</a><a href="#trends">训练曲线</a><a href="#models">保存与候选</a><a href="#capabilities">能力证据</a><a href="#data">数据状态</a></nav>
</header>
<main id="content"></main><footer>仅读取已有产物 · 不加载模型 · 不启动仿真、评估或TensorBoard</footer>
</body></html>
