name: Portable CPU contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
          python -m pip install --no-deps -e .
      - name: Architecture constraints
        run: python scripts/check_architecture.py --base refactor-migration-v1
      - name: Ruff (lint + format check)
        run: |
          python -m pip install ruff==0.8.4
          python -m ruff check src/native_stand/{simulation,experiments,artifacts,learning,tasks,integrations} src/native_stand/cli.py scripts/check_architecture.py
          python -m ruff format --check src/native_stand/{simulation,experiments,artifacts,learning,tasks,integrations} src/native_stand/cli.py scripts/check_architecture.py
      - name: Run explicit portable fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/test_portable_cpu.py
